<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Measure &amp; draw — Keith Hume Fraser Reserve</title>
<style>
 body{margin:0;font-family:system-ui,sans-serif;background:#182A56;color:#fff;overflow:hidden}
 #bar{position:fixed;top:0;left:0;right:0;background:#182A56f2;padding:6px 10px;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
 #bar b{color:#F5C518}
 #bar a{color:#9db8f7}
 #stage{position:fixed;inset:52px 0 0 0;overflow:hidden;cursor:crosshair;background:#0d1830;touch-action:none}
 #world{position:absolute;transform-origin:0 0}
 canvas,img{position:absolute;top:0;left:0;user-select:none;-webkit-user-drag:none}
 button{background:#2749B8;color:#fff;border:0;border-radius:6px;padding:5px 10px;font-weight:700;cursor:pointer;font-size:14px}
 button.tool.on{background:#F5C518;color:#182A56}
 .note{opacity:.75;font-size:11.5px}
 #readout{min-width:150px}
</style></head><body>
<div id="bar">
 <a href="index.html">&#8592; back</a>
 <b>Measure &amp; draw</b>
 <button class="tool on" id="t_measure" onclick="setTool('measure')">Measure</button>
 <button class="tool" id="t_line" onclick="setTool('line')">Line</button>
 <button class="tool" id="t_arrow" onclick="setTool('arrow')">Arrow</button>
 <button class="tool" id="t_rect" onclick="setTool('rect')">Rect</button>
 <button onclick="undo()">Undo</button>
 <button onclick="clearAll()">Clear</button>
 <button onclick="exportPts()">Copy points</button>
 <button onclick="zoomBy(1.25)">+</button><button onclick="zoomBy(0.8)">&#8722;</button>
 <span id="readout">click to start</span>
 <span id="coords" class="note"></span>
 <span class="note">click = point &middot; double-click ends a line &middot; drag pans &middot; Esc cancels &middot; indicative (rev 9.45) &mdash; survey to confirm</span>
</div>
<div id="stage"><div id="world">
 <img id="map" src="assets/measure_base.jpg">
 <canvas id="ov"></canvas>
</div></div>
<script>
const Aa=3.138379,Ad=-3.138379,BX=-1113702.951,BY=18250033.402;
const toWorld=(x,y)=>[(x-BX)/Aa,(y-BY)/Ad];
const COLS={measure:'#ff2d78',line:'#ffd400',arrow:'#00e5ff',rect:'#b04dff'};
const stage=document.getElementById('stage'),world=document.getElementById('world');
const mapimg=document.getElementById('map'),cv=document.getElementById('ov'),ctx=cv.getContext('2d');
let W=2080,H=2240,scale=0.3,ox=10,oy=6,drag=null,moved=false;
let tool='measure',cur=[],shapes=[];
mapimg.addEventListener('load',()=>{W=mapimg.naturalWidth;H=mapimg.naturalHeight;cv.width=W;cv.height=H;fit();});
function fit(){const r=stage.getBoundingClientRect();scale=Math.min(r.width/W,r.height/H)*0.98;
 ox=(r.width-W*scale)/2;oy=(r.height-H*scale)/2;apply();}
function apply(){world.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`;}
function zoomBy(f){const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,f);}
function zoomAt(mx,my,f){const ns=Math.min(8,Math.max(0.08,scale*f));
 ox=mx-(mx-ox)*ns/scale;oy=my-(my-oy)*ns/scale;scale=ns;apply();draw();}
function setTool(t){if(cur.length)finishCur();tool=t;
 for(const k of ['measure','line','arrow','rect'])
  document.getElementById('t_'+k).classList.toggle('on',k===t);
 msg('tool: '+t);}
function msg(s){document.getElementById('readout').innerHTML=s;}
stage.addEventListener('wheel',e=>{e.preventDefault();
 const r=stage.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.18:1/1.18);},{passive:false});
stage.addEventListener('pointerdown',e=>{drag=[e.clientX-ox,e.clientY-oy];moved=false;stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{
 if(drag){const nx=e.clientX-drag[0],ny=e.clientY-drag[1];
  if(Math.hypot(nx-ox,ny-oy)>4)moved=true;
  if(moved){ox=nx;oy=ny;apply();}}
 const r=stage.getBoundingClientRect();
 const px=(e.clientX-r.left-ox)/scale,py=(e.clientY-r.top-oy)/scale;
 if(px>=0&&py>=0&&px<=W&&py<=H){const w=toWorld(px,py);
  document.getElementById('coords').textContent=`E ${w[0].toFixed(1)} N ${w[1].toFixed(1)}`;}
});
stage.addEventListener('pointerup',e=>{
 if(drag&&!moved){
  const r=stage.getBoundingClientRect();
  const px=(e.clientX-r.left-ox)/scale,py=(e.clientY-r.top-oy)/scale;
  if(px>=0&&py>=0&&px<=W&&py<=H)addPoint([px,py]);
 } drag=null;});
stage.addEventListener('dblclick',e=>{e.preventDefault();if(cur.length)finishCur();});
window.addEventListener('keydown',e=>{
 if(e.key==='Escape'){cur=[];draw();msg('cancelled');}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
});
function addPoint(p){
 cur.push(p);
 if((tool==='arrow'||tool==='rect')&&cur.length===2)finishCur();
 draw();
}
function finishCur(){
 if(tool==='rect'&&cur.length===2)shapes.push({type:'rect',pts:cur});
 else if(tool==='arrow'&&cur.length===2)shapes.push({type:'arrow',pts:cur});
 else if(cur.length>=2)shapes.push({type:tool,pts:cur});
 cur=[];draw();
}
function undo(){
 if(cur.length){cur.pop();}
 else if(shapes.length){shapes.pop();}
 draw();msg('undo');
}
function clearAll(){cur=[];shapes=[];draw();msg('cleared');}
function segLen(a,b){const wa=toWorld(...a),wb=toWorld(...b);return Math.hypot(wb[0]-wa[0],wb[1]-wa[1]);}
function rectCorners(a,b){
 const x1=Math.min(a[0],b[0]),x2=Math.max(a[0],b[0]);
 const y1=Math.min(a[1],b[1]),y2=Math.max(a[1],b[1]);
 return [[x1,y2],[x2,y2],[x2,y1],[x1,y1]]; // SW,SE,NE,NW in world terms (y down = S)
}
function drawShape(s,active){
 const c=COLS[s.type],sc=Math.max(scale,0.15);
 ctx.lineWidth=3/sc;ctx.strokeStyle=c;ctx.fillStyle=c;
 const pts=s.pts;
 if(s.type==='rect'&&pts.length===2){
  const [a,b]=pts;
  ctx.strokeRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]));
  const wx=Math.abs(toWorld(...a)[0]-toWorld(...b)[0]).toFixed(1);
  const wy=Math.abs(toWorld(...a)[1]-toWorld(...b)[1]).toFixed(1);
  label(`${wx} x ${wy} m`,(a[0]+b[0])/2,(a[1]+b[1])/2,sc);
  return;
 }
 ctx.beginPath();ctx.moveTo(...pts[0]);
 for(const p of pts.slice(1))ctx.lineTo(...p);
 ctx.stroke();
 for(const p of pts){ctx.beginPath();ctx.arc(p[0],p[1],4.5/sc,0,7);ctx.fill();}
 if(s.type==='arrow'&&pts.length===2){
  const [a,b]=pts,ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=14/sc;
  ctx.beginPath();ctx.moveTo(...b);
  ctx.lineTo(b[0]-L*Math.cos(ang-0.42),b[1]-L*Math.sin(ang-0.42));
  ctx.lineTo(b[0]-L*Math.cos(ang+0.42),b[1]-L*Math.sin(ang+0.42));
  ctx.closePath();ctx.fill();
  label(segLen(a,b).toFixed(1)+' m',(a[0]+b[0])/2,(a[1]+b[1])/2,sc);
 }
 if(s.type==='measure'){
  let tot=0;
  for(let i=1;i<pts.length;i++){
   const L=segLen(pts[i-1],pts[i]);tot+=L;
   label(L.toFixed(1)+' m',(pts[i-1][0]+pts[i][0])/2+6,(pts[i-1][1]+pts[i][1])/2-6,sc);
  }
  if(active&&pts.length>1)msg(`<b>total ${tot.toFixed(1)} m</b> &middot; ${pts.length} pts`);
 }
 if(s.type==='line'&&active&&pts.length>1){
  let tot=0;for(let i=1;i<pts.length;i++)tot+=segLen(pts[i-1],pts[i]);
  msg(`line ${tot.toFixed(1)} m`);
 }
}
function label(txt,x,y,sc){
 ctx.font=`${Math.round(15/Math.min(Math.max(scale,0.25),2))}px sans-serif`;
 const keep=ctx.fillStyle;
 ctx.lineWidth=4/sc;ctx.strokeStyle='#000';ctx.strokeText(txt,x,y);
 ctx.fillStyle='#fff';ctx.fillText(txt,x,y);
 ctx.fillStyle=keep;ctx.strokeStyle=keep;
}
function draw(){
 ctx.clearRect(0,0,W,H);
 for(const s of shapes)drawShape(s,false);
 if(cur.length)drawShape({type:tool,pts:cur},true);
}
function exportPts(){
 const all=[...shapes];
 if(cur.length>=2)all.push({type:tool,pts:cur});
 if(!all.length){alert('Nothing drawn yet.');return;}
 let out=[];
 all.forEach((s,i)=>{
  let pts=s.pts, extra='';
  if(s.type==='rect'){pts=rectCorners(...s.pts);
   const wx=Math.abs(toWorld(...s.pts[0])[0]-toWorld(...s.pts[1])[0]).toFixed(1);
   const wy=Math.abs(toWorld(...s.pts[0])[1]-toWorld(...s.pts[1])[1]).toFixed(1);
   extra=` (corners SW,SE,NE,NW; ${wx} x ${wy} m)`;}
  if(s.type==='measure'||s.type==='line'){
   let tot=0;for(let j=1;j<s.pts.length;j++)tot+=segLen(s.pts[j-1],s.pts[j]);
   extra=` (${s.pts.length} pts, ${tot.toFixed(1)} m)`;}
  if(s.type==='arrow')extra=' (tail then head)';
  out.push(`# shape ${i+1}: ${s.type}${extra}`);
  for(const p of pts){const w=toWorld(...p);out.push(w[0].toFixed(1)+','+w[1].toFixed(1));}
 });
 const txt=out.join('\n');
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(txt).then(()=>alert(all.length+' shape(s) copied (MGA55 E,N)'),
   ()=>window.prompt('Copy the coordinates:',txt));
 }else{window.prompt('Copy the coordinates:',txt);}
}
</script></body></html>
